name: Economy Toolkit Release Packaging

on:
  workflow_dispatch:
  push:
    tags:
      - "economy-toolkit-v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate-release-tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Validate semantic version tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^economy-toolkit-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag: $TAG"
            echo "Expected: economy-toolkit-vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "[ok] semver tag valid: $TAG"

  build-release-artifacts:
    needs: [validate-release-tag]
    if: always() && (needs.validate-release-tag.result == 'success' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller

      - name: Smoke compile
        run: make economy-smoke

      - name: Build package
        run: python tools/package_economy_toolkit_release.py

      - name: Verify package checksum
        shell: bash
        run: |
          set -euo pipefail
          PKG=$(ls dist/release/*.zip | head -n 1)
          python tools/verify_release_checksum.py --package "$PKG" --checksum-file "$PKG.sha256"

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/release/*

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: economy-toolkit-${{ runner.os }}
          path: dist/release/*

  publish-github-release:
    if: startsWith(github.ref, 'refs/tags/economy-toolkit-v')
    needs: [build-release-artifacts]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Build changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          body: ${{ steps.changelog.outputs.changelog }}
