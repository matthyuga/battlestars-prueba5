[Debug]

## This shows the unskinned vert positions (grey dots) as they are imported from the mesh asset. 
## Don't leave enabled, and dont enable with a ton of characters active.
# Setting type: Boolean
# Default value: false
Show Unskinned Verts = false

## This shows the initial skinned vert positions (cyan dots) that Preg+ has computed. Not the inflated ones. 
## Don't leave enabled, and dont enable with a ton of characters active.
# Setting type: Boolean
# Default value: false
Show P+ Skinned Verts = false

## This shows the inflated vert positions (green dots) that Preg+ has computed. 
## Don't leave enabled, and dont enable with a ton of characters active.
# Setting type: Boolean
# Default value: false
Show P+ Inflated Verts = false

## This shows the deltas computed from the base mesh that we use to build the blendshape. 
## Don't leave enabled, and dont enable with a ton of characters active.
# Setting type: Boolean
# Default value: false
Show P+ vertex deltas = false

## This shows the characters bones bind poses. 
## Don't leave enabled.
# Setting type: Boolean
# Default value: false
Show Bind Pose = false

## This will allow me to debug where the mesh is, or is not, affected by the main Preg+ slider.  This will disable some Preg+ sliders temporarily. 
## Don't leave enabled.
# Setting type: Boolean
# Default value: false
Balloon mode (Debug mode) = false

## Will force update the belly shape every x ticks to help debug belly shape changes during animations.  
## Don't leave enabled.
# Setting type: Boolean
# Default value: false
Refresh X Ticks (Debug mode) = false

## Will cause all mesh verticies to be affected by sliders so I can narrow down which meshes are behaving, and which are not.  
## Don't leave enabled
# Setting type: Boolean
# Default value: false
Entire Mesh Debugging (Debug mode) = false

