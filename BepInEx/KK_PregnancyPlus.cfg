# Default value: false
Enable Debug of calculations (Debug mode) = false

## Will log lots of Preg+ details to the console, but will condiserably slow down the game.  
## Don't leave enabled
# Setting type: Boolean
# Default value: false
Enable Debug Logging (Debug mode) = false

