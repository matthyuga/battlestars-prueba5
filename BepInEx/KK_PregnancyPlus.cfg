# Setting type: Single
# Default value: 40
# Acceptable value range: From 0 to 40
Max additional belly size = 40

## When enabled, the Preg+ belly shape will be the only shape used for pregnancy and inflation.  It disables the KK_Pregnancy shape in main gameplay.
# Setting type: Boolean
# Default value: true
Override KK_Pregnancy belly shape = true

