Camera guide lines = Framing, GridThirds

## Thickness of the guide lines in pixels.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 1 to 5
Guide lines thickness = 1

## List of saved resolutions in JSON format.
# Setting type: String
# Default value: 
Saved Resolutions = 

[JPG Settings]

## Save screenshots in lower quality in return for smaller file sizes.
## WARNING: This is not supported by some screenshot types, they will save as png anyways. Transparency is NOT supported.
## Strongly consider not using this option if you want to share your work.
# Setting type: Boolean
# Default value: false
Save screenshots as .jpg instead of .png = false

## Lower quality = lower file sizes. Even 100 is worse than a .png file.
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 1 to 100
Quality of .jpg files = 100

[Keyboard shortcuts]

## Capture a simple "as you see it" screenshot of the game. Not affected by settings for rendered screenshots.
# Setting type: KeyboardShortcut
# Default value: F9
Take UI screenshot = F9

## Take a screenshot with no interface. Can be configured by other settings to increase quality and turn on transparency.
# Setting type: KeyboardShortcut
# Default value: F11
Take rendered screenshot = F11

## Open a quick access window with the most common settings.
# Setting type: KeyboardShortcut
# Default value: F11 + LeftShift
Open settings window = F11 + LeftShift

## Captures a 360 screenshot around current camera. The created image is in equirectangular format and can be viewed by most 360 image viewers (e.g. Google Cardboard).
# Setting type: KeyboardShortcut
# Default value: F11 + LeftControl
Take 360 screenshot = F11 + LeftControl

## Capture a high quality screenshot without UI in stereoscopic 3D (2 captures for each eye in one image). These images can be viewed by crossing your eyes or any stereoscopic image viewer.
# Setting type: KeyboardShortcut
# Default value: F11 + LeftAlt
Take rendered 3D screenshot = F11 + LeftAlt

## Captures a 360 screenshot around current camera in stereoscopic 3D (2 captures for each eye in one image). These images can be viewed by image viewers supporting 3D stereo format (e.g. VR Media Player - 360° Viewer).
# Setting type: KeyboardShortcut
# Default value: F11 + LeftShift + LeftControl
Take 360 3D screenshot = F11 + LeftShift + LeftControl

