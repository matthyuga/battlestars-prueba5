## Settings file was created by plugin Screenshot Manager v21.0
## Plugin GUID: com.bepis.bepinex.screenshotmanager

[360 Screenshots]

## Horizontal resolution (width) of 360 degree/panorama screenshots. Decrease if you have issues. WARNING: Memory usage can get VERY high - 4096 needs around 4GB of free RAM/VRAM to create, 8192 will need much more.
# Setting type: Int32
# Default value: 4096
# Acceptable values: 1024, 2048, 4096, 8192
360 screenshot resolution = 4096

[3D Settings]

## Distance between the two captured stereoscopic screenshots in arbitrary units.
# Setting type: Single
# Default value: 0.18
# Acceptable value range: From 0.01 to 0.5
3D screenshot eye separation = 0.18

## Move images in stereoscopic screenshots closer together by this percentage (discards overlapping parts). Useful for viewing with crossed eyes. Does not affect 360 stereoscopic screenshots.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0 to 0.9
3D screenshot image separation offset = 0.25

## Flip left and right eye for cross-eyed viewing. Disable to use the screenshots in most VR image viewers.
# Setting type: Boolean
# Default value: true
Flip left and right eye = true

Quality of .jpg files = 100

[General]

## Whether screenshot messages will be displayed on screen. Messages will still be written to the log.
# Setting type: Boolean
# Default value: true
Show messages on screen = true

