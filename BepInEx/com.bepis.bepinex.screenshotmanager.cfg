[Render Settings]

## Capture screenshots in a higher resolution and then downscale them to desired size. Prevents aliasing, perserves small details and gives a smoother result, but takes longer to create.
# Setting type: Int32
# Default value: 2
# Acceptable value range: From 1 to 4
Screenshot upsampling ratio = 2

## Replaces background with transparency in rendered image. Works only if there are no 3D objects covering the background (e.g. the map). Works well in character creator and studio.
# Setting type: AlphaMode
# Default value: rgAlpha
# Acceptable values: None, blackout, rgAlpha
Transparency in rendered screenshots = rgAlpha

## Capture character card images in a higher resolution and then downscale them to desired size. Prevents aliasing, perserves small details and gives a smoother result, but takes longer to create.
# Setting type: Int32
# Default value: 3
# Acceptable value range: From 1 to 4
Card image upsampling ratio = 3

