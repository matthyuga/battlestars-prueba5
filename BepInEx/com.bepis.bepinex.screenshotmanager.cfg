# Setting type: NameFormat
# Default value: NameDateType
# Acceptable values: NameDate, NameTypeDate, NameDateType, TypeDate, TypeNameDate, Date
Screenshot filename format = NameDateType

## Forces the Name part of the filename to always be this instead of varying depending on the name of the current game. Use "Koikatsu" to get the old filename behaviour.
# Setting type: String
# Default value: 
Screenshot filename Name override = 

