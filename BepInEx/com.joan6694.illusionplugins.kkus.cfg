[Auto Joint Correction]

## If this is enabled, joint correction is automatically set as set here when adding a new character. Changes to this setting require a studio restart to take effect.
# Setting type: Boolean
# Default value: true
Auto Joint Correction = true

## Desired initial state of the joint correction toggles. This is applied if the Auto Joint Correction setting is enabled.
## - Arm correction affects shoulder, upperarm, elbow and upper hand
## - Forearm correction affects mainly the wrist area. It can cause the wrist to deform abnormally.
## - Leg correction affects the leg, knee and calf.
## - Thigh correction affects mainly the thigh area.
## - Crotch and Ankle correction is handled by PE, check its settings if you want to change those.
# Setting type: JointCorrectionArea
# Default value: All
# Acceptable values: LeftArm, RightArm, LeftLeg, RightLeg, LeftForearm, RightForearm, LeftThigh, RightThigh, All
# Multiple values can be set at the same time by separating them with , (e.g. Debug, Warning)
Default values = All

